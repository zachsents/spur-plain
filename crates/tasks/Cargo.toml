[package]
name = "tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
ai = { version = "0.1.0", path = "../ai" }
futures = "0.3"
gpui.workspace = true
jiff = "0.2"
kit.workspace = true
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
store = { version = "0.1.0", path = "../store" }

# Read by `cargo xtask bundle tasks`.
[package.metadata.bundle]
name = "Tasks"
icon = "list-checks"
